[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["demo", "scripts"]

[tool.setuptools.package-data]
demo = ["web/*", "web/replays/*.jsonl", "web/assets/*.md"]

[project]
name = "lettings-village"
version = "0.1.0"
description = "A playable, auditable village around a real lettings operations agent"
requires-python = ">=3.12"
dependencies = ["uvicorn==0.43.0"]

[project.optional-dependencies]
live = ["anthropic>=1.12.1", "pydantic>=2.14.0", "pyyaml>=6.0.3", "rich>=14.0.0"]
dev = ["pytest>=9.0.0", "ruff>=0.16.0", "pyyaml>=6.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
